      const icon = o.includes('yes') ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : o.includes('trust') ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

let paneLines = 200;
function refreshPane() { if(ws&&activePane) ws.send(JSON.stringify({type:'read_pane',pane_id:activePane,lines:paneLines})); }
function loadMore() { paneLines = Math.min(paneLines + 500, 5000); refreshPane(); }
function wsCanSend() {
  if (!ws) return false;
  if (ws.readyState != null && ws.readyState !== 1) return false;
  if (connState === 'disconnected' || connState === 'connecting') return false;
  const ref = lastPongAt || connLiveAt;
  if (ref > 0 && Date.now() - ref >= STALE_MS) return false;
  return true;
}

function newSubmitId() {
  return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function clearPendingSubmitTimer() {
  if (pendingSubmit && pendingSubmit.timer) {
    clearTimeout(pendingSubmit.timer);
    pendingSubmit.timer = null;
  }
}

function beginPendingSubmit({ text, paneId, id, phase }) {
  clearPendingSubmitTimer();
  pendingSubmit = {
    text: text || '',
    paneId,
    id,
    phase,
    timer: setTimeout(() => { failPendingSubmit('发送超时，内容已保留'); }, SEND_ACK_TIMEOUT_MS),
  };
}

function failPendingSubmit(note) {
  if (!pendingSubmit) return;
  const kept = pendingSubmit.text;
  clearPendingSubmitTimer();
  pendingSubmit = null;
  const i = document.getElementById('termInput');
  if (i && !i.value && kept) i.value = kept;
  syncClearTermBtn();
  if (note) showTermToast(note);
  if (window.cue) cue('error');
}

function completePendingSubmit() {
  if (!pendingSubmit) return;
  const kept = pendingSubmit.text;
  clearPendingSubmitTimer();
  pendingSubmit = null;
  const i = document.getElementById('termInput');
  if (i && i.value === kept) i.value = '';
  syncClearTermBtn();
  setTimeout(refreshPane, 500);
}

function syncClearTermBtn() {
  const i = document.getElementById('termInput');
  const btn = document.getElementById('clearTermBtn');
  if (!btn) return;
  btn.hidden = !(i && i.value);
}

function clearTermInput() {
  const i = document.getElementById('termInput');
  if (i) i.value = '';
  if (pendingSubmit) {
    clearPendingSubmitTimer();
    pendingSubmit = null;
  }
  if (inputMode === 'slash-live') {
    exitSlashLive({ submitted: false, scrub: true });
  }
  syncClearTermBtn();
  if (i) i.focus();
}

function onSubmitAck(msg) {
  if (!pendingSubmit) return false;
  if (msg.id && msg.id !== pendingSubmit.id) return false;
  if (msg.type === 'error') {
    if (msg.id === pendingSubmit.id) {
      failPendingSubmit(msg.message || '发送失败，内容已保留');
      return true;
    }
    return false;
  }
  if (msg.type !== 'command_result') return false;
  if (msg.id !== pendingSubmit.id) return false;
  if (!msg.ok) {
    failPendingSubmit(msg.note || msg.message || '发送失败，内容已保留');
    return true;
  }
  if (pendingSubmit.phase === 'text' && msg.command === 'send_text') {
    pendingSubmit.phase = 'enter';
    try {
      if (!wsCanSend()) {
        failPendingSubmit('网络不可用，内容已保留');
        return true;
      }
      ws.send(JSON.stringify({
        type: 'send_keys', pane_id: pendingSubmit.paneId, keys: ['Enter'], id: pendingSubmit.id,
      }));
    } catch (_) {
      failPendingSubmit('发送失败，内容已保留');
    }
    return true;
  }
  if ((pendingSubmit.phase === 'enter' || pendingSubmit.phase === 'enter-only') && msg.command === 'send_keys') {
    completePendingSubmit();
    return true;
  }
  return false;
}

function submitLiveEnter(inputEl) {
  if (!activePane || pendingSubmit) return;
  if (!wsCanSend()) {
    showTermToast('网络不可用，未发送');
    if (window.cue) cue('error');
    return;
  }
  const id = newSubmitId();
  try {
    ws.send(JSON.stringify({ type: 'send_keys', pane_id: activePane, keys: ['Enter'], id }));
  } catch (_) {
    showTermToast('发送失败，内容已保留');
    if (window.cue) cue('error');
    return;
  }
  beginPendingSubmit({ text: inputEl ? inputEl.value : '', paneId: activePane, id, phase: 'enter-only' });
  exitSlashLive({ submitted: true });
}

function sendText() {
  const i = document.getElementById('termInput');
  if (!activePane) return;
  if (pendingSubmit) return;
  if (inputMode === 'slash-live') {
    submitLiveEnter(i);
    return;
  }
  if (!i.value) return;
  if (!wsCanSend()) {
    showTermToast('网络不可用，消息未发送');
    if (window.cue) cue('error');
    return;
  }
  const text = i.value;
  const id = newSubmitId();
  try {
    ws.send(JSON.stringify({ type: 'send_text', pane_id: activePane, text, id }));
  } catch (_) {
    showTermToast('发送失败，内容已保留');
    if (window.cue) cue('error');
    return;
  }
  beginPendingSubmit({ text, paneId: activePane, id, phase: 'text' });
  syncClearTermBtn();
}

// --- Nav Tray (collie-style) ---
let keyQueue = [], armedMod = null, ctrlConfirm = null;
const CTRL_PRESETS = [
  {label:'Ctrl C', keys:['ctrl+c']},
  {label:'Ctrl D', keys:['ctrl+d'], danger:true},
  {label:'Ctrl U', keys:['ctrl+u']},
  {label:'Ctrl R', keys:['ctrl+r']},
  {label:'Ctrl L', keys:['ctrl+l']},
  {label:'Ctrl Z', keys:['ctrl+z'], danger:true},
];
const DANGER_KEYS = new Set(['ctrl+c','ctrl+d','ctrl+z']);

function fireKey(k) {
  if(window.cue) cue('tick');
  if (inputMode === 'slash-live' && (k === 'Escape' || k === 'Enter') && keyQueue.length === 0 && !armedMod) {
    if (k === 'Enter') {
      const input = document.getElementById('termInput');
      submitLiveEnter(input);
      return;
    }
    exitSlashLive({ submitted: false, scrub: true });
    setTimeout(refreshPane, 300);
    return;
  }
  const composed = armedMod ? `${armedMod}+${k}` : k;
  if (keyQueue.length > 0 || armedMod) {
    keyQueue.push(composed);
    armedMod = null;
    if(window.cue) cue('droplet');
    renderKeyQueue();
    renderMods();
  } else {
    sendKeys([composed]);
  }
}

function armMod(m) {
  armedMod = armedMod === m ? null : m;
  if(window.cue) cue('toggle');
  renderMods();
}

function renderMods() {
  const s = document.getElementById('modShift');
  const c = document.getElementById('modCtrl');
  if (s) s.classList.toggle('armed', armedMod === 'shift');
  if (c) c.classList.toggle('armed', armedMod === 'ctrl');
}

function renderKeyQueue() {
  const strip = document.getElementById('keyQueueStrip');
  if (!keyQueue.length && !armedMod) { strip.style.display = 'none'; return; }
  strip.style.display = 'flex';
  let html = keyQueue.map((k,i) => {
    const isDanger = DANGER_KEYS.has(k.toLowerCase());
    const label = k === 'backspace' || k === 'BSpace' || k === 'Delete' ? '\u232b'
      : k.includes('+') ? k.replace('ctrl+','Ctrl ').replace('shift+','\u21e7 ') : k;
    return `<span class="queue-chip${isDanger?' danger':''}" onclick="removeQueueKey(${i})">${label} \u00d7</span>`;
  }).join('');
  if (armedMod) html += `<span style="color:var(--muted);font-size:12px;padding:4px">${armedMod==='shift'?'\u21e7':'Ctrl'} + \u2026</span>`;
  html += `<span style="margin-left:auto;display:flex;gap:4px">`;
  html += `<button onclick="sendQueuedKeys()" style="padding:6px 12px;border-radius:6px;border:none;background:${keyQueue.some(k=>DANGER_KEYS.has(k.toLowerCase()))?'var(--red)':'var(--blue)'};color:#fff;font-size:12px;font-weight:600;cursor:pointer">Send</button>`;
  html += `<button onclick="clearKeyQueue()" style="padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:12px;cursor:pointer">✕</button>`;
  html += `</span>`;
  strip.innerHTML = html;
}

function removeQueueKey(i) { keyQueue.splice(i,1); renderKeyQueue(); }
function clearKeyQueue() { keyQueue=[]; armedMod=null; renderKeyQueue(); renderMods(); }
function sendQueuedKeys() {
  if (!keyQueue.length) return;
  if(window.cue) cue('success');
  sendKeys(keyQueue);
  keyQueue=[]; armedMod=null; renderKeyQueue(); renderMods();
}

// 键盘面板的展开状态跨会话记住：手机上每次进终端都要先点开面板才能按键，
// 白白多一次点击。记住上次的选择后，常用键盘的人再进来就是展开的。
// 只存「哪个面板」这一个值——两者互斥，不需要各存一份。
const KEYPAD_STATE_KEY = 'herdr_keypad_open';
var SNIPPETS_KEY = 'herdr_snippets';
var DEFAULT_SNIPPETS = [
  {
    title: '并行',
    body: '用 subagents 并行开发；本地开发不用 worktree；不要用 superpowers 相关的 TDD；最后统一验证。',
  },
  { title: 'Slot 2', body: '' },
  { title: 'Slot 3', body: '' },
];
var snippetEditIdx = null;

function saveKeypadState(which) {
  try {
    if (which) localStorage.setItem(KEYPAD_STATE_KEY, which);
    else localStorage.removeItem(KEYPAD_STATE_KEY);
  } catch (e) { /* 隐私模式下 localStorage 可能不可写，不该影响主流程 */ }
}

function normalizeSnippets(raw) {
  if (!Array.isArray(raw) || raw.length !== 3) return DEFAULT_SNIPPETS.map(s => ({ ...s }));
  return raw.map((s, i) => {
    const title = (s && typeof s.title === 'string' ? s.title : '').trim() || `Slot ${i + 1}`;
    const body = s && typeof s.body === 'string' ? s.body : '';
    return { title, body };
  });
}

function loadSnippets() {
  try {
    const raw = localStorage.getItem(SNIPPETS_KEY);
    if (!raw) return DEFAULT_SNIPPETS.map(s => ({ ...s }));
    return normalizeSnippets(JSON.parse(raw));
  } catch (e) {
    return DEFAULT_SNIPPETS.map(s => ({ ...s }));
  }
}

function saveSnippets(list) {
  const normalized = normalizeSnippets(list);
  try { localStorage.setItem(SNIPPETS_KEY, JSON.stringify(normalized)); } catch (e) { /* privacy mode */ }
  return normalized;
}

function renderSnippets() {
  const host = document.getElementById('snippetButtons');
  if (!host) return;
  const list = loadSnippets();
  host.innerHTML = list.map((s, i) => {
    const title = esc(s.title);
    return `<div class="snippet-btn" data-snippet-idx="${i}" role="button" tabindex="0">` +
      `<span class="snippet-title">${title}</span>` +
      `<button type="button" class="snippet-edit" data-edit-idx="${i}" aria-label="Edit snippet ${i + 1}">✎</button>` +
      `</div>`;
  }).join('');
}

function openSnippetEditor(idx) {
  const list = loadSnippets();
  if (idx < 0 || idx > 2) return;
  snippetEditIdx = idx;
  document.getElementById('snippetTitleInput').value = list[idx].title;
  document.getElementById('snippetBodyInput').value = list[idx].body;
  document.getElementById('snippetEditor').style.display = '';
}

function closeSnippetEditor() {
  document.getElementById('snippetEditor').style.display = 'none';
  snippetEditIdx = null;
}

function commitSnippetEditor() {
  if (snippetEditIdx == null) return;
  const list = loadSnippets();
  list[snippetEditIdx] = {
    title: document.getElementById('snippetTitleInput').value,
    body: document.getElementById('snippetBodyInput').value,
  };
  saveSnippets(list);
  closeSnippetEditor();
  renderSnippets();
}

function fireSnippet(idx) {
  const list = loadSnippets();
  const s = list[idx];
  if (!s) return;
  if (!s.body.trim()) {
    openSnippetEditor(idx);
    return;
  }
  quickSend(s.body);
}

/** 打开终端时按上次的选择恢复面板。无存档或存档无效时保持收起，不打扰。 */
function restoreKeypadState() {
  const keys = document.getElementById('termKeys');
  const quick = document.getElementById('quickDock');
  if (!keys || !quick) return;
  let saved = null;
  try { saved = localStorage.getItem(KEYPAD_STATE_KEY); } catch (e) {}
  // 只认这两个值：其它一律当没存过，避免脏数据展开出意料外的面板
  keys.style.display = saved === 'keys' ? '' : 'none';
  quick.style.display = saved === 'quick' ? '' : 'none';
  if (saved === 'quick') renderSnippets();
}

function toggleKeysDock() {

function toggleQuickDock() {

(function wireSnippetButtons() {
  const host = document.getElementById('snippetButtons');
  if (!host) return;
  let pressTimer = null;
  let longPressFired = false;
  host.addEventListener('click', (e) => {
    if (longPressFired) {
      longPressFired = false;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    const edit = e.target.closest('[data-edit-idx]');
    if (edit) {
      e.preventDefault();
      e.stopPropagation();
      openSnippetEditor(Number(edit.getAttribute('data-edit-idx')));
      return;
    }
    const btn = e.target.closest('[data-snippet-idx]');
    if (btn) fireSnippet(Number(btn.getAttribute('data-snippet-idx')));
  });
  host.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const btn = e.target.closest('[data-snippet-idx]');
    if (!btn) return;
    e.preventDefault();
    fireSnippet(Number(btn.getAttribute('data-snippet-idx')));
  });
  host.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('[data-snippet-idx]');
    if (!btn || e.target.closest('[data-edit-idx]')) return;
    const idx = Number(btn.getAttribute('data-snippet-idx'));
    longPressFired = false;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      longPressFired = true;
      openSnippetEditor(idx);
    }, 550);
  });
  const clearPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
  host.addEventListener('pointerup', clearPress);
  host.addEventListener('pointercancel', clearPress);
  host.addEventListener('pointerleave', clearPress);
})();

function switchKeyTab(tab) {
  document.getElementById('tabKeys').classList.toggle('active', tab==='keys');

  if (tab==='digits' && !dp.innerHTML) {
    // 1–9 后补 空 / 0 / ⌫，方便改选编号选项时退格。
    const cells = [1,2,3,4,5,6,7,8,9].map(d => `<button class="digit-key" onclick="fireKey('${d}')">${d}</button>`);
    cells.push(`<button class="digit-key" style="visibility:hidden" aria-hidden="true" tabindex="-1"></button>`);
    cells.push(`<button class="digit-key" onclick="fireKey('0')">0</button>`);
    cells.push(`<button class="digit-key" onclick="fireKey('backspace')" aria-label="Backspace">\u232b</button>`);
    dp.innerHTML = cells.join('');
  }
}

function toggleCtrlPresets() {
  const el = document.getElementById('ctrlPresets');
  const chevron = document.getElementById('ctrlChevron');
  const show = el.style.display === 'none';
  el.style.display = show ? 'grid' : 'none';
  chevron.textContent = show ? '\u25be' : '\u25b8';
  if (show && !el.innerHTML) {
    el.innerHTML = CTRL_PRESETS.map(p => {
      const cls = p.danger ? 'ctrl-key danger' : 'ctrl-key';
      return `<button class="${cls}" onclick="pressCtrl('${p.label}')">${p.label}</button>`;
    }).join('');
  }
}

function pressCtrl(label) {
  const preset = CTRL_PRESETS.find(p => p.label === label);
  if (!preset) return;
  // If composing (queue has items), just stage it
  if (keyQueue.length > 0) { keyQueue.push(...preset.keys); renderKeyQueue(); return; }
  // Two-tap confirm for danger keys
  if (preset.danger && ctrlConfirm !== label) {
    ctrlConfirm = label;
    if(window.cue) cue('error');
    const el = document.getElementById('ctrlPresets');
    el.innerHTML = CTRL_PRESETS.map(p => {
      const cls = p.danger ? (p.label===label?'ctrl-key confirm':'ctrl-key danger') : 'ctrl-key';
      const txt = p.label===label ? 'Confirm?' : p.label;
      return `<button class="${cls}" onclick="pressCtrl('${p.label}')">${txt}</button>`;
    }).join('');
    setTimeout(() => { ctrlConfirm=null; toggleCtrlPresets(); toggleCtrlPresets(); }, 3000);
    return;
  }
  ctrlConfirm = null;
  sendKeys(preset.keys);
}

(function wireTermInput() {
  const input = document.getElementById('termInput');
  if (!input) return;

  input.addEventListener('compositionstart', () => { slashComposing = true; });
  input.addEventListener('compositionend', (e) => {
    slashComposing = false;
    if (inputMode !== 'slash-live' || !ws || !activePane) return;
    const text = e.data || '';
    if (text) {
      if (!liveSendText(text)) return;
      refreshPane();
    }
  });

  input.addEventListener('beforeinput', (e) => {
    if (inputMode === 'buffered' && e.inputType === 'insertText' && shouldEnterSlashLive(input.value, e.data || '')) {
      e.preventDefault();
      enterSlashLive({ seedSlash: true });
      return;
    }
    if (inputMode !== 'slash-live' || slashComposing) return;
    if (!ws || !activePane) return;

    if (e.inputType === 'insertText' && e.data) {
      if (!liveSendText(e.data)) return;
      refreshPane();
      return;
    }
    if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward') {
      ws.send(JSON.stringify({ type: 'send_keys', pane_id: activePane, keys: ['backspace'] }));
      refreshPane();
    }
  });

  input.addEventListener('input', () => { syncClearTermBtn(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendText();
      return;
    }
    if (e.key === 'Escape' && inputMode === 'slash-live') {
      e.preventDefault();
      exitSlashLive({ submitted: false, scrub: true });
      setTimeout(refreshPane, 300);
    }
  });
})();

  if (el.scrollTop === 0 && paneLines < 5000) loadMore();
});

// --- Slash Live Mode helpers (also covered by web/tests/slash-live.test.html) ---
var SLASH_LIVE_TIMEOUT_MS = 1500;
var SLASH_SCRUB_BACKSPACES = 8;
var SLASH_REFRESH_MS = 400;
var BUFFERED_REFRESH_MS = 3000;

function looksLikeSlashMenu(text) {
  if (!text || typeof text !== 'string') return false;
  const hits = text.split('\n').filter(line => /^\s*\/[a-zA-Z][\w-]*/.test(line));
  return hits.length >= 2;
}

function buildSlashCleanupKeys({ scrub }) {
  const keys = ['Escape'];
  if (scrub) {
    for (let i = 0; i < SLASH_SCRUB_BACKSPACES; i++) keys.push('backspace');
  }
  return keys;
}

function shouldEnterSlashLive(currentValue, incomingChar) {
  return (!currentValue || currentValue === '') && incomingChar === '/';
}

function setInputMode(mode) {
  inputMode = mode;
  const badge = document.getElementById('slashLiveBadge');
  if (badge) badge.hidden = mode !== 'slash-live';
  const input = document.getElementById('termInput');
  if (input) input.placeholder = mode === 'slash-live' ? 'Slash live…' : 'Type…';
}

function clearSlashLiveTimer() {
  if (slashLiveTimer) { clearTimeout(slashLiveTimer); slashLiveTimer = null; }
}

function setPaneRefreshInterval(ms) {
  if (refreshInterval) clearInterval(refreshInterval);
  if (activePane) refreshInterval = setInterval(refreshPane, ms);
}

function cleanupSlashRemote({ scrub }) {
  if (!ws || !activePane) return;
  const keys = buildSlashCleanupKeys({ scrub });
  ws.send(JSON.stringify({ type: 'send_keys', pane_id: activePane, keys }));
}

function liveSendText(text) {
  if (!ws || !activePane) {
    exitSlashLive({ submitted: false, scrub: false, openFallback: true });
    return false;
  }
  ws.send(JSON.stringify({ type: 'send_text', pane_id: activePane, text }));
  return true;
}

function exitSlashLive({ submitted, scrub, openFallback } = {}) {
  if (inputMode !== 'slash-live') {
    if (openFallback) openCommandPaletteFallback();
    return;
  }
  clearSlashLiveTimer();
  if (!submitted) cleanupSlashRemote({ scrub: !!scrub });
  setInputMode('buffered');
  slashMenuSeen = false;
  const input = document.getElementById('termInput');
  if (input && !submitted) input.value = '';
  syncClearTermBtn();
  setPaneRefreshInterval(BUFFERED_REFRESH_MS);
  if (openFallback) openCommandPaletteFallback();
}

function enterSlashLive({ seedSlash }) {
  if (!ws || !activePane) {
    openCommandPaletteFallback();
    return;
  }
  const input = document.getElementById('termInput');
  if (input) input.value = seedSlash ? '/' : (input.value || '');
  syncClearTermBtn();
  setInputMode('slash-live');
  slashMenuSeen = false;
  setPaneRefreshInterval(SLASH_REFRESH_MS);
  if (seedSlash && !liveSendText('/')) {
    // liveSendText 已 exit + fallback；勿再挂超时定时器
    return;
  }
  refreshPane();
  clearSlashLiveTimer();
  slashLiveTimer = setTimeout(() => {
    if (inputMode === 'slash-live' && !slashMenuSeen) {
      exitSlashLive({ submitted: false, scrub: true, openFallback: true });
    }
  }, SLASH_LIVE_TIMEOUT_MS);
}

function openCommandPaletteFallback() {
  document.getElementById('cmdPalette').style.display = '';
  document.getElementById('cmdSearch').value = '';
  filterCommands();
  document.getElementById('cmdSearch').focus();
}

function getAgentCommands() {
  const a = agents.find(x => x.pane_id === activePane);
  if (!a) return [];
  const key = (a.agent || '').toLowerCase();
  if (COMMANDS[key]) return COMMANDS[key];
  if (key.startsWith('claude')) return COMMANDS.claude;
  if (key.startsWith('codex')) return COMMANDS.codex;
  if (key.startsWith('pi') || key === 'kiro') return COMMANDS.pi;
  if (key.startsWith('opencode')) return COMMANDS.opencode;
  return COMMANDS.claude; // fallback
}

function openCommandPalette() {
  if (window.cue) cue('page');
  const input = document.getElementById('termInput');
  if (input) input.value = '';
  enterSlashLive({ seedSlash: true });
  if (input) input.focus();
}
function closePalette() { document.getElementById('cmdPalette').style.display = 'none'; }

function filterCommands() {
  const q = (document.getElementById('cmdSearch').value || '').toLowerCase();
  const cmds = getAgentCommands();
  const filtered = q ? cmds.filter(c => c.cmd.includes(q) || c.desc.toLowerCase().includes(q)) : cmds.filter(c => c.common);
  const el = document.getElementById('cmdList');
  if (!filtered.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.8rem">No commands match</div>'; return; }
  el.innerHTML = filtered.map(c => `<div role="button" tabindex="0" onclick="runCommand('${c.cmd}')" onkeydown="if(event.key==='Enter')runCommand('${c.cmd}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:2px;transition:background 0.15s" onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background=''">
    <span style="font-family:monospace;font-weight:600;font-size:0.85rem;${c.danger?'color:var(--red)':'color:var(--blue)'}">${c.cmd}</span>
    <span style="flex:1;font-size:0.75rem;color:var(--muted)">${c.desc}</span>
  </div>`).join('');
}

function runCommand(cmd) {
  closePalette();
  if (!ws || !activePane) return;
  ws.send(JSON.stringify({type:'send_text', pane_id: activePane, text: cmd}));
  ws.send(JSON.stringify({type:'send_keys', pane_id: activePane, keys:['Enter']}));
  setTimeout(refreshPane, 500);
}

// --- Web Push ---
let pushSubscription = null;

// SW 注册与推送解耦：SW 同时负责离线缓存，若仍挡在 PushManager 检测之后，
// 不支持推送、或用户不开通知的场景就完全享受不到缓存。
// 用相对路径 './sw.js' 而非 '/sw.js'——部署在子路径时绝对路径会 404。
let swRegistration = null;

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    swRegistration = await navigator.serviceWorker.register('./sw.js');
    return swRegistration;
  } catch (e) {
    console.warn('Service worker registration failed:', e);
    return null;
  }
}

async function initPush() {
  const reg = await registerServiceWorker();
  if (!reg || !('PushManager' in window)) {
    // SW 可能已注册成功（缓存仍生效），只是这个浏览器不支持推送
    document.getElementById('pushStatus').textContent = 'Push not supported in this browser';
    document.getElementById('pushToggle').style.display = 'none';
    return;
  }
  try {
    pushSubscription = await reg.pushManager.getSubscription();
    updatePushUI();
  } catch (e) {
    document.getElementById('pushStatus').textContent = 'Service worker error: ' + e.message;
  }
}

function updatePushUI() {
  const btn = document.getElementById('pushToggle');
  const status = document.getElementById('pushStatus');
  if (pushSubscription) {
    btn.textContent = 'Disable Push';
    btn.style.background = 'var(--red)';
    status.innerHTML = '<span style="color:var(--green)">● Enabled</span>';
  } else {
    btn.textContent = 'Enable Push';
    btn.style.background = 'var(--green)';
    status.innerHTML = '<span style="color:var(--muted)">○ Disabled</span>';
  }
}

async function togglePush() {
  if (pushSubscription) {
    // Unsubscribe
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({type: 'push_unsubscribe', subscription: pushSubscription.toJSON()}));
    }
    await pushSubscription.unsubscribe();
    pushSubscription = null;
    updatePushUI();
  } else {
    // Subscribe
    try {
      const relayUrl = localStorage.getItem('herdr_relay_url') || '';
      const httpUrl = relayUrl.replace('wss://', 'https://').replace('ws://', 'http://');
      const resp = await fetch(httpUrl + '/api/vapid-public-key');
      const {publicKey} = await resp.json();
      if (!publicKey) {
        document.getElementById('pushStatus').textContent = 'VAPID key not configured on relay';
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      pushSubscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({type: 'push_subscribe', subscription: pushSubscription.toJSON()}));
      }
      updatePushUI();
    } catch (e) {
      document.getElementById('pushStatus').textContent = 'Error: ' + e.message;
    }
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

initPush();

// --- iOS 软键盘补偿 ---
// position:fixed 相对 layout viewport 定位，而软键盘只缩小 visual viewport，
// 因此终端视图底部的输入栏会被键盘遮住。iOS 上 interactive-widget 与
// VirtualKeyboard API 均未实现（WebKit Bug 259770 / 230225），dvh 也不含键盘，
// 唯一可行方案是监听 visualViewport 手动把遮挡高度写进 CSS 变量。
(function initKeyboardInset() {
  const vv = window.visualViewport;
  if (!vv) return;  // 不支持则保持原样，--kb-inset 恒为 0

  let frame = null;
  const sync = () => {
    if (frame) cancelAnimationFrame(frame);
    // visualViewport 的 resize 事件在 iOS 上可能延迟或不触发，用 rAF 合并多次抖动
    frame = requestAnimationFrame(() => {
      frame = null;
      // 被键盘等 UI 占据的高度：布局视口高 - (可视视口高 + 其顶部偏移)
      const hidden = window.innerHeight - (vv.height + vv.offsetTop);
      document.documentElement.style.setProperty('--kb-inset', Math.max(0, Math.round(hidden)) + 'px');
    });
  };

  vv.addEventListener('resize', sync);
  vv.addEventListener('scroll', sync);
  sync();
})();
