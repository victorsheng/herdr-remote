<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick Snippets 测试 · herdr-remote</title>
<style>
  body { font-family: -apple-system, system-ui, 'PingFang SC', sans-serif; margin: 0; padding: 20px;
         background: #1a1b26; color: #c0caf5; line-height: 1.5; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  .sub { color: #565f89; font-size: 0.8rem; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.82rem; margin-bottom: 20px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #2f3549; }
  th { color: #565f89; font-weight: 600; font-size: 0.72rem; }
  td.num { font-family: 'SF Mono', Menlo, monospace; text-align: right; }
  .pass { color: #9ece6a; font-weight: 600; }
  .fail { color: #f7768e; font-weight: 600; }
  #summary { padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; font-weight: 600; }
  #summary.ok { background: rgba(158,206,106,0.12); border: 1px solid #9ece6a; color: #9ece6a; }
  #summary.bad { background: rgba(247,118,142,0.12); border: 1px solid #f7768e; color: #f7768e; }
  .note { font-size: 0.76rem; color: #565f89; margin: -8px 0 18px; }
  #frame { position: absolute; left: -99999px; top: 0; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>

<h1>Quick Snippets 测试</h1>
<div class="sub">加载 <code>../index.html</code>，验证默认值、normalize、持久化、渲染与发送行为</div>

<div id="summary">运行中…</div>
<div id="results"></div>

<div class="note">
  直接操作 iframe 内 <code>contentWindow</code> 全局：<code>SNIPPETS_KEY</code> /
  <code>DEFAULT_SNIPPETS</code> / <code>normalizeSnippets</code> / <code>loadSnippets</code> /
  <code>saveSnippets</code> / <code>renderSnippets</code> / <code>fireSnippet</code> /
  <code>openSnippetEditor</code>。mock <code>ws</code> 验证空槽开编辑器、非空槽走 <code>send_text</code>+Enter。
</div>

<iframe id="frame" src="../index.html?snippets_test=1"></iframe>

<script>
const rows = [];
let allPass = true;
let fatal = null;

function record(name, actual, expected, ok) {
  if (!ok) allPass = false;
  rows.push({ name, actual, expected, ok });
}

function run(doc, win) {
  const {
    SNIPPETS_KEY,
    DEFAULT_SNIPPETS,
    normalizeSnippets,
    loadSnippets,
    saveSnippets,
    renderSnippets,
    fireSnippet,
    openSnippetEditor,
  } = win;

  // ── 全局存在性 ──────────────────────────────────────────
  record('SNIPPETS_KEY', String(SNIPPETS_KEY), "'herdr_snippets'", SNIPPETS_KEY === 'herdr_snippets');

  const hasDefaults = Array.isArray(DEFAULT_SNIPPETS) && DEFAULT_SNIPPETS.length === 3;
  record('DEFAULT_SNIPPETS 长度', hasDefaults ? String(DEFAULT_SNIPPETS.length) : String(DEFAULT_SNIPPETS), '3', hasDefaults);

  if (hasDefaults) {
    record('DEFAULT[0].title', DEFAULT_SNIPPETS[0].title, '并行', DEFAULT_SNIPPETS[0].title === '并行');
    const body0 = (DEFAULT_SNIPPETS[0].body || '');
    record('DEFAULT[0].body 含 subagents', body0.includes('subagents') ? 'yes' : JSON.stringify(body0).slice(0, 40), 'yes',
           !!body0.trim() && body0.includes('subagents'));
    record('DEFAULT[1]/[2].body 空',
           `1="${DEFAULT_SNIPPETS[1].body}" 2="${DEFAULT_SNIPPETS[2].body}"`,
           'both empty',
           !(DEFAULT_SNIPPETS[1].body || '').trim() && !(DEFAULT_SNIPPETS[2].body || '').trim());
  }

  const fns = [
    ['normalizeSnippets', normalizeSnippets],
    ['loadSnippets', loadSnippets],
    ['saveSnippets', saveSnippets],
    ['renderSnippets', renderSnippets],
    ['fireSnippet', fireSnippet],
    ['openSnippetEditor', openSnippetEditor],
  ];
  for (const [name, fn] of fns) {
    record(`${name} 存在`, typeof fn, 'function', typeof fn === 'function');
  }

  if (typeof loadSnippets !== 'function' || typeof normalizeSnippets !== 'function') {
    return;
  }

  // ── 1) 清空后 load → defaults ───────────────────────────
  try { win.localStorage.removeItem(SNIPPETS_KEY); } catch (e) {}
  const defaults = loadSnippets();
  record('清空后 loadSnippets → 3 槽', String(defaults.length), '3', defaults.length === 3);
  record('清空后槽0 标题=并行', defaults[0] && defaults[0].title, '并行',
         defaults[0] && defaults[0].title === '并行');
  record('清空后槽0 正文非空',
         defaults[0] && defaults[0].body && defaults[0].body.trim() ? 'non-empty' : 'empty',
         'non-empty',
         !!(defaults[0] && defaults[0].body && defaults[0].body.trim()));
  record('清空后槽1/2 正文空',
         defaults[1] && defaults[2]
           ? `1="${defaults[1].body}" 2="${defaults[2].body}"` : 'missing',
         'both empty',
         defaults[1] && defaults[2] &&
           !defaults[1].body.trim() && !defaults[2].body.trim());

  // ── 2) 坏数据 → defaults ────────────────────────────────
  const bad = normalizeSnippets({ nope: true });
  record('normalizeSnippets 坏数据回退',
         bad && bad.length === 3 && bad[0].title === '并行' ? 'defaults' : JSON.stringify(bad),
         '3 defaults (并行)',
         Array.isArray(bad) && bad.length === 3 && bad[0].title === '并行');

  // ── 3) 空标题 → Slot 2 ──────────────────────────────────
  const norm = normalizeSnippets([
    { title: 'A', body: 'aaa' },
    { title: '  ', body: 'bbb' },
    { title: 'C', body: '' },
  ]);
  record('空标题 → Slot 2', norm[1] && norm[1].title, 'Slot 2',
         norm[1] && norm[1].title === 'Slot 2');

  // ── 4) save / load round-trip ───────────────────────────
  if (typeof saveSnippets === 'function') {
    saveSnippets([
      { title: '并行', body: 'keep' },
      { title: 'Mine', body: 'hello' },
      { title: 'Slot 3', body: '' },
    ]);
    const loaded = loadSnippets();
    record('saveSnippets → loadSnippets round-trip',
           loaded[1] ? `${loaded[1].title}/${loaded[1].body}` : 'missing',
           'Mine/hello',
           loaded[1] && loaded[1].title === 'Mine' && loaded[1].body === 'hello');
  }

  // ── 5) renderSnippets → 3 buttons ───────────────────────
  const tv = doc.querySelector('.terminal-view');
  if (tv) tv.classList.add('active');
  const dock = doc.getElementById('quickDock');
  if (dock) dock.style.display = '';

  record('snippetEditor 存在',
         doc.getElementById('snippetEditor') ? 'yes' : 'no', 'yes',
         !!doc.getElementById('snippetEditor'));
  record('quickDock 有 quick-dock-dense',
         dock && dock.classList.contains('quick-dock-dense') ? 'yes' : 'no', 'yes',
         !!(dock && dock.classList.contains('quick-dock-dense')));

  const snippets = doc.getElementById('snippetButtons');
  record('snippetButtons 容器存在', snippets ? 'yes' : 'no', 'yes', !!snippets);

  try { win.localStorage.removeItem(SNIPPETS_KEY); } catch (e) {}
  if (typeof renderSnippets === 'function') renderSnippets();
  const btns = snippets ? snippets.querySelectorAll('.snippet-btn') : [];
  record('renderSnippets → 3 .snippet-btn', String(btns.length), '3', btns.length === 3);

  const firstTitle = btns[0] && (btns[0].querySelector('.snippet-title') || btns[0]);
  const firstText = firstTitle ? firstTitle.textContent.trim() : '';
  record('首按钮标题「并行」', firstText, '并行', firstText === '并行' || firstText.includes('并行'));

  // ── 6) fireSnippet 行为（mock ws）───────────────────────
  if (typeof fireSnippet !== 'function') return;

  let sent = [];
  const realWs = win.ws;
  const realPane = win.activePane;
  win.ws = { send(data) { sent.push(JSON.parse(data)); } };
  win.activePane = 'pane-test';

  try { win.localStorage.removeItem(SNIPPETS_KEY); } catch (e) {}
  if (typeof renderSnippets === 'function') renderSnippets();

  const editor = doc.getElementById('snippetEditor');
  if (editor) editor.style.display = 'none';

  fireSnippet(1); // empty slot
  record('空槽 fireSnippet(1) 打开编辑器',
         editor && editor.style.display !== 'none' ? 'open' : 'closed',
         'open',
         editor && editor.style.display !== 'none');
  record('空槽不发送', String(sent.length), '0', sent.length === 0);

  sent = [];
  if (editor) editor.style.display = 'none';
  fireSnippet(0); // filled default
  record('非空槽发送 send_text(含 subagents)',
         sent.find(m => m.type === 'send_text')
           ? (sent.find(m => m.type === 'send_text').text || '').includes('subagents') ? 'yes' : 'no-subagents'
           : `types=[${sent.map(m => m.type).join(',')}]`,
         'yes',
         sent.some(m => m.type === 'send_text' && typeof m.text === 'string' && m.text.includes('subagents')));
  record('非空槽跟随 send_keys Enter',
         sent.some(m => m.type === 'send_keys' && m.keys && m.keys[0] === 'Enter') ? 'yes' : 'no',
         'yes',
         sent.some(m => m.type === 'send_keys' && m.keys && m.keys[0] === 'Enter'));

  // ── 7) 恢复 ─────────────────────────────────────────────
  win.ws = realWs;
  win.activePane = realPane;
  try { win.localStorage.removeItem(SNIPPETS_KEY); } catch (e) {}
  if (editor) editor.style.display = 'none';
}

function finish() {
  const tbl = ['<table><tr><th>检查项</th><th style="text-align:right">实测</th>' +
               '<th style="text-align:right">期望</th><th>结论</th></tr>'];
  for (const r of rows) {
    tbl.push(`<tr><td>${r.name}</td><td class="num">${r.actual}</td>` +
             `<td class="num">${r.expected}</td>` +
             `<td class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</td></tr>`);
  }
  tbl.push('</table>');
  document.getElementById('results').innerHTML = tbl.join('');

  const s = document.getElementById('summary');
  s.className = allPass && !fatal ? 'ok' : 'bad';
  const failed = rows.filter(r => !r.ok).length;
  s.textContent = fatal ? `✗ 测试无法完成：${fatal}`
    : allPass ? `✓ 全部 ${rows.length} 项通过`
              : `✗ ${failed}/${rows.length} 项未达标`;

  window.__SNIPPETS_RESULT__ = { allPass, fatal, rows };
  window.__SNIPPETS_DONE__ = true;
}

const frame = document.getElementById('frame');
frame.addEventListener('load', () => {
  try { run(frame.contentDocument, frame.contentWindow); }
  catch (e) { fatal = e.message || String(e); allPass = false; }
  finish();
});
</script>
</body>
</html>
